<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis</title>
    <style>
        body {
            padding: 50px;
            box-sizing: border-box;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 80vh;
            gap: 8px;

        }
        .top {
            border: 3px solid black;
            height: 10%;
        }
        .bottom {
            border: 8px solid black;
            height: 5%;
        }

        .middle {
            display: flex;
            flex: 1;
            gap: 8px;
        }
        .box1 {
            width: 80%;
            border: 3px solid blue;
        }
        .box2 {
            width: 20%;
            border: 3px solid red;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="top">

        </div>
        <div class="middle">
            <div class="box1">

            </div>
            <div class="box2">

            </div>
        </div>
        <div class="bottom">

        </div>
    </div>
</body>
</html>
