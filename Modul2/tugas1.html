<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1</title>
    <style>
        input {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <form action="">
        <label for="nama">Nama</label>
        <input type="text" name="nama" id="nama" value="Rifqi" readonly>
        <br>

        <label for="saldo">Saldo</label>
        <input type="text" name="saldo" id="saldo" maxlength="5">
        <br>

        <label for="jenis-kelamin">Jenis Kelamin</label>
        <input type="text" name="jenis-kelamin" id="jenis-kelamin" value="laki laki" disabled>
        <br>

        <label for="umur">Umur</label>
        <input type="text" name="umur" id="umur" required>
        <br>

        <label for="nim">NIM</label>
        <input type="text" name="nim" id="nim" maxlength="9" pattern="[A-Z0-9]{9}" required>

        <br>
        <button type="submit">Kirim</button>
    </form>
</body>
</html>
